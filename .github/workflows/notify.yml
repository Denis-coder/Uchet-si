name: Notify
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pywebpush
      - run: python scripts/notify.py
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: Запомнить, что сводка уже ушла
        run: |
          git config user.email "actions@github.com"
          git config user.name "Uchet SI"
          git add data/notify-state.json
          git diff --cached --quiet || git commit -m "СИ: сводка уведомлений"
          git push
