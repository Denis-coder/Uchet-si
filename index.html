  <script>
/** Правила поверки: манометр — 1 год, термометр биметаллический — 2 года */

function isTracked(name) {
  const n = String(name || '').toLowerCase().replace(/ё/g, 'е')
  if (n.includes('манометр')) return true
  if (n.includes('термометр') && n.includes('биметалл')) return true
  return false
}

function isManometer(name) {
  return String(name || '').toLowerCase().replace(/ё/g, 'е').includes('манометр')
}

function isBimetal(name) {
  const n = String(name || '').toLowerCase().replace(/ё/g, 'е')
  return n.includes('термометр') && n.includes('биметалл')
}

function defaultIntervalMonths(name) {
  return isBimetal(name) ? 24 : 12
}

/** Парсинг: 10.10.2024 | 24ДЯУ | ДЯУ24 | 3К24 | 24ДЯУ2К */
function parseCheckDate(raw) {
  if (raw == null || !String(raw).trim()) return null
  const s = String(raw).trim()

  const m1 = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})$/)
  if (m1) {
    const d = +m1[1], mo = +m1[2] - 1
    const y = +m1[3] < 100 ? 2000 + +m1[3] : +m1[3]
    const dt = new Date(y, mo, d)
    return isNaN(dt.getTime()) ? null : dt
  }

  const iso = Date.parse(s)
  if (!isNaN(iso) && /^\d{4}/.test(s)) return new Date(iso)

  const upper = s.toUpperCase().replace(/\s/g, '').replace(/K/g, 'К')

  // 24ДЯУ2К / 24ДЯУ / ДЯУ24
  const dyau = upper.match(/(?:(\d{2})ДЯУ|ДЯУ(\d{2}))(?:(\d)К)?/)
  if (dyau) {
    const yy = 2000 + parseInt(dyau[1] || dyau[2], 10)
    if (dyau[3]) {
      const q = +dyau[3]
      return new Date(yy + 1, q * 3, 0) // end of quarter next year
    }
    return new Date(yy + 1, 11, 31)
  }

  // 3К24 / 24К3
  const kq = upper.match(/(?:(\d)К(\d{2})|(\d{2})К(\d))/)
  if (kq) {
    const q = +(kq[1] || kq[4])
    const yy = 2000 + parseInt(kq[2] || kq[3], 10)
    return new Date(yy + 1, q * 3, 0)
  }

  if (/^\d{2}$/.test(upper)) return new Date(2000 + +upper + 1, 11, 31)
  return null
}

function addMonths(date, months) {
  const d = new Date(date)
  d.setMonth(d.getMonth() + months)
  return d
}

function formatDue(d) {
  const dd = String(d.getDate()).padStart(2, '0')
  const mm = String(d.getMonth() + 1).padStart(2, '0')
  return `до ${dd}.${mm}.${d.getFullYear()}`
}

const SOON_DAYS = 30

function getStatus(inst, now = new Date()) {
  if (!isTracked(inst.name)) {
    return { status: 'na', due: null, label: 'не контролируется', tracked: false }
  }
  const parsed = parseCheckDate(inst.lastCheck)
  if (!parsed) {
    return {
      status: 'unknown',
      due: null,
      label: inst.lastCheck ? String(inst.lastCheck) : 'нет даты',
      tracked: true,
    }
  }
  const months = inst.intervalMonths ?? defaultIntervalMonths(inst.name)
  // Для кодов ДЯУ/К срок уже «годен до» в parseCheckDate (клеймо+1 год).
  // Для обычной даты lastCheck = дата поверки → + interval.
  const isCode = /[ДдяаукКk]/i.test(String(inst.lastCheck || ''))
  const due = isCode ? parsed : addMonths(parsed, months)

  if (now.getTime() > due.getTime()) {
    return { status: 'overdue', due, label: formatDue(due), tracked: true }
  }
  const soon = new Date(now)
  soon.setDate(soon.getDate() + SOON_DAYS)
  if (due.getTime() <= soon.getTime()) {
    return { status: 'soon', due, label: formatDue(due), tracked: true }
  }
  return { status: 'ok', due, label: formatDue(due), tracked: true }
}

function statusLabel(status, checkKind) {
  const kind = /к/i.test(checkKind || '') ? 'Калибровка' : 'Поверка'
  switch (status) {
    case 'ok': return 'Годен'
    case 'soon': return `${kind} истекает`
    case 'overdue': return `${kind} просрочена`
    case 'unknown': return 'Без даты'
    default: return 'Не контролируется'
  }
}

/** Хэш пароля (PBKDF2) — только в браузере, без сервера */

function bufToHex(buf) {
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('')
}

function hexToBuf(hex) {
  const a = new Uint8Array(hex.length / 2)
  for (let i = 0; i < a.length; i++) a[i] = parseInt(hex.substr(i * 2, 2), 16)
  return a.buffer
}

async function hashPassword(password, saltHex) {
  const enc = new TextEncoder()
  const salt = saltHex
    ? hexToBuf(saltHex)
    : crypto.getRandomValues(new Uint8Array(16)).buffer
  const keyMaterial = await crypto.subtle.importKey(
    'raw',
    enc.encode(password),
    'PBKDF2',
    false,
    ['deriveBits'],
  )
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    256,
  )
  return {
    salt: bufToHex(salt),
    hash: bufToHex(bits),
  }
}

async function verifyPassword(password, saltHex, hashHex) {
  const { hash } = await hashPassword(password, saltHex)
  return hash === hashHex
}


const ALIASES = {
  name: ['наименование', 'название', 'name'],
  type: ['тип', 'type'],
  serial: ['заводской', 'заводской номер', 'зав', 'serial'],
  year: ['год', 'год выпуска', 'year'],
  range: ['диапазон', 'range'],
  accuracyClass: ['класс', 'класс точности', 'class'],
  location: ['место', 'место установки', 'location'],
  object: ['объект', 'object'],
  shop: ['цех', 'shop'],
  unit: ['установка', 'unit'],
  interval: ['интервал', 'межповерочный', 'mpi'],
  lastCheck: ['дата', 'дата поверки', 'дата последней', 'поверка', 'lastcheck'],
  checkKind: ['п/к', 'поверка/калибровка', 'вид', 'checkkind'],
  note: ['примечание', 'note', 'комментарий'],
}

function norm(s) {
  return String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim()
}

function mapHeader(h) {
  const x = norm(h)
  for (const [field, list] of Object.entries(ALIASES)) {
    if (list.some((a) => x.includes(a) || a.includes(x))) return field
  }
  return null
}

function cellStr(v) {
  if (v == null) return ''
  if (v instanceof Date) {
    return `${String(v.getDate()).padStart(2, '0')}.${String(v.getMonth() + 1).padStart(2, '0')}.${v.getFullYear()}`
  }
  return String(v).trim()
}

function parseInterval(raw) {
  if (raw == null || raw === '') return null
  if (typeof raw === 'number' && !isNaN(raw)) return Math.round(raw)
  const m = String(raw).match(/(\d+)/)
  return m ? parseInt(m[1], 10) : null
}

async function parseExcelFile(file) {
  const XLSX = window.XLSX
  if (!XLSX) throw new Error('Библиотека Excel не загружена')
  const buf = await file.arrayBuffer()
  const wb = XLSX.read(buf, { type: 'array', cellDates: true })
  const instruments = []
  const sheets = []

  for (const sheetName of wb.SheetNames) {
    const sheet = wb.Sheets[sheetName]
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false })
    if (!rows.length) continue

    let headerIdx = 0
    for (let i = 0; i < Math.min(15, rows.length); i++) {
      const texts = (rows[i] || []).filter((c) => typeof c === 'string' && String(c).length > 1).length
      if (texts >= 3) { headerIdx = i; break }
    }
    const headers = (rows[headerIdx] || []).map((h) => String(h || ''))
    const mapping = headers.map(mapHeader)
    if (!mapping.some((m) => m === 'name' || m === 'serial')) continue

    sheets.push(sheetName)
    for (let r = headerIdx + 1; r < rows.length; r++) {
      const row = rows[r] || []
      const obj = {}
      mapping.forEach((f, i) => { if (f) obj[f] = cellStr(row[i]) })
      if (!obj.name && !obj.serial) continue
      const name = obj.name || ''
      instruments.push({
        id: crypto.randomUUID(),
        name,
        type: obj.type || '',
        serial: obj.serial || '',
        year: obj.year || '',
        range: obj.range || '',
        accuracyClass: obj.accuracyClass || '',
        location: obj.location || '',
        object: obj.object || '',
        shop: obj.shop || '',
        unit: obj.unit || '',
        intervalMonths: parseInterval(obj.interval) ?? (name ? defaultIntervalMonths(name) : null),
        lastCheck: obj.lastCheck || '',
        checkKind: obj.checkKind || '',
        note: obj.note || '',
        sheet: sheetName,
      })
    }
  }
  return { instruments, sheets }
}

function exportExcel(instruments, fileName = 'uchet-si.xlsx') {
  const XLSX = window.XLSX
  const data = instruments.map((i, idx) => ({
    '№': idx + 1,
    Наименование: i.name,
    Тип: i.type,
    'Заводской номер': i.serial,
    'Год выпуска': i.year,
    Диапазон: i.range,
    Класс: i.accuracyClass,
    'Место установки': i.location,
    Объект: i.object,
    Цех: i.shop,
    Установка: i.unit,
    'Интервал, мес.': i.intervalMonths ?? '',
    'Дата поверки/калибровки': i.lastCheck,
    'П/К': i.checkKind,
    Примечание: i.note,
    Лист: i.sheet,
  }))
  const ws = XLSX.utils.json_to_sheet(data)
  const wb = XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb, ws, 'СИ')
  XLSX.writeFile(wb, fileName)
}

/** CSV 14 полей для QR */
function instrumentToQr(inst) {
  const cols = [
    '', inst.name, inst.type, inst.serial, inst.year, inst.range,
    inst.accuracyClass, inst.location, inst.object, inst.shop, inst.unit,
    inst.intervalMonths ?? '', inst.lastCheck, inst.checkKind,
  ]
  return cols.map((c) => {
    const s = String(c ?? '')
    return s.includes(',') || s.includes('"') ? `"${s.replace(/"/g, '""')}"` : s
  }).join(',')
}

function parseQrPayload(text) {
  // factory serial only or CSV
  const t = String(text || '').trim()
  if (!t.includes(',')) return { serial: t }
  const parts = []
  let cur = '', inQ = false
  for (let i = 0; i < t.length; i++) {
    const ch = t[i]
    if (ch === '"') { inQ = !inQ; continue }
    if (ch === ',' && !inQ) { parts.push(cur); cur = ''; continue }
    cur += ch
  }
  parts.push(cur)
  // map like Excel columns 1-based name at index 1...
  return {
    name: parts[1] || '',
    type: parts[2] || '',
    serial: parts[3] || parts[0] || '',
    year: parts[4] || '',
    range: parts[5] || '',
    accuracyClass: parts[6] || '',
    location: parts[7] || '',
    object: parts[8] || '',
    shop: parts[9] || '',
    unit: parts[10] || '',
    intervalMonths: parts[11] ? parseInt(parts[11], 10) : null,
    lastCheck: parts[12] || '',
    checkKind: parts[13] || '',
  }
}

const CFG_KEY = 'uchet-si-github-cfg'

function defaultCfg() {
  return {
    owner: 'Denis-coder',
    repo: 'Uchet-si',
    branch: 'main',
    path: 'si-journal.json',
    token: '',
  }
}

function loadCfg() {
  try {
    const raw = localStorage.getItem(CFG_KEY)
    if (!raw) return defaultCfg()
    return { ...defaultCfg(), ...JSON.parse(raw) }
  } catch {
    return defaultCfg()
  }
}

function saveCfg(cfg) {
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg))
}

function apiBase(cfg) {
  return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`
}

function rawUrl(cfg) {
  return `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${cfg.path}`
}

async function pullJournal(cfg) {
  const url = `${rawUrl(cfg)}?t=${Date.now()}`
  const res = await fetch(url, { cache: 'no-store' })
  if (res.status === 404) return null
  if (!res.ok) throw new Error(`Не удалось загрузить с GitHub (${res.status})`)
  const data = await res.json()
  if (!data || !Array.isArray(data.instruments)) {
    throw new Error('Файл на сайте повреждён')
  }
  return data
}

function toBase64(str) {
  const bytes = new TextEncoder().encode(str)
  let bin = ''
  bytes.forEach((b) => { bin += String.fromCharCode(b) })
  return btoa(bin)
}

async function pushJournal(cfg, journal) {
  if (!cfg.token?.trim()) throw new Error('Нужен токен GitHub для записи')
  const path = cfg.path.replace(/^\/+/, '')
  const contentsUrl = `${apiBase(cfg)}/contents/${path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(cfg.branch)}`

  let sha
  const getRes = await fetch(contentsUrl, {
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: `Bearer ${cfg.token}`,
      'X-GitHub-Api-Version': '2022-11-28',
    },
  })
  if (getRes.ok) sha = (await getRes.json()).sha
  else if (getRes.status !== 404) {
    const t = await getRes.text()
    throw new Error(githubErr(getRes.status, t))
  }

  const body = {
    message: `СИ: ${journal.instruments.length} шт., журнал ${ (journal.auditLog || []).length }`,
    content: toBase64(JSON.stringify(journal)),
    branch: cfg.branch,
  }
  if (sha) body.sha = sha

  const putRes = await fetch(contentsUrl.replace(/\?ref=.*/, ''), {
    method: 'PUT',
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: `Bearer ${cfg.token}`,
      'X-GitHub-Api-Version': '2022-11-28',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  })
  if (!putRes.ok) throw new Error(githubErr(putRes.status, await putRes.text()))
}

function githubErr(status, text) {
  if (status === 401 || status === 403) return 'Нет права записи или неверный токен GitHub.'
  if (status === 404) return 'Репозиторий или файл не найден.'
  return `GitHub ${status}: ${String(text).slice(0, 160)}`
}

function canWrite(cfg) {
  return !!(cfg.token && cfg.token.trim())
}


const LOCAL_KEY = 'uchet-si-journal-v2'
const SESSION_KEY = 'uchet-si-session'

function emptyJournal() {
  return {
    version: 2,
    updatedAt: new Date().toISOString(),
    users: [],
    instruments: [],
    auditLog: [],
  }
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LOCAL_KEY)
    if (!raw) return emptyJournal()
    const j = JSON.parse(raw)
    return {
      version: 2,
      updatedAt: j.updatedAt || '',
      users: Array.isArray(j.users) ? j.users : [],
      instruments: Array.isArray(j.instruments) ? j.instruments : [],
      auditLog: Array.isArray(j.auditLog) ? j.auditLog : [],
    }
  } catch {
    return emptyJournal()
  }
}

function saveLocal(journal) {
  journal.updatedAt = new Date().toISOString()
  localStorage.setItem(LOCAL_KEY, JSON.stringify(journal))
}

function getSession() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY)
    return raw ? JSON.parse(raw) : null
  } catch {
    return null
  }
}

function setSession(user) {
  if (user) sessionStorage.setItem(SESSION_KEY, JSON.stringify(user))
  else sessionStorage.removeItem(SESSION_KEY)
}

async function login(journal, login, password) {
  const u = journal.users.find((x) => x.login.toLowerCase() === login.toLowerCase())
  if (!u) return { error: 'Неверный логин или пароль' }
  const ok = await verifyPassword(password, u.salt, u.passwordHash)
  if (!ok) return { error: 'Неверный логин или пароль' }
  const session = { login: u.login, name: u.name, role: u.role || 'worker' }
  setSession(session)
  return { user: session }
}

async function createUser(journal, { login, name, password, role }, actor) {
  if (!login?.trim() || !password) throw new Error('Логин и пароль обязательны')
  if (journal.users.some((u) => u.login.toLowerCase() === login.toLowerCase())) {
    throw new Error('Такой логин уже есть')
  }
  const { salt, hash } = await hashPassword(password)
  const user = {
    login: login.trim(),
    name: (name || login).trim(),
    salt,
    passwordHash: hash,
    role: role || 'worker',
  }
  journal.users.push(user)
  addAudit(journal, actor, {
    action: 'user_create',
    serial: '',
    field: null,
    oldValue: null,
    newValue: user.login,
  })
  saveLocal(journal)
  return user
}

async function bootstrapAdmin(journal, password, name = 'Администратор') {
  if (journal.users.length) throw new Error('Пользователи уже есть')
  return createUser(
    journal,
    { login: 'admin', name, password, role: 'admin' },
    { login: 'admin', name, role: 'admin' },
  )
}

function addAudit(journal, actor, entry) {
  journal.auditLog = journal.auditLog || []
  journal.auditLog.unshift({
    id: crypto.randomUUID(),
    at: new Date().toISOString(),
    login: actor?.login || '',
    name: actor?.name || '',
    action: entry.action,
    instrumentId: entry.instrumentId || null,
    serial: entry.serial || '',
    field: entry.field ?? null,
    oldValue: entry.oldValue ?? null,
    newValue: entry.newValue ?? null,
  })
  // keep last 2000
  if (journal.auditLog.length > 2000) journal.auditLog.length = 2000
}

function diffInst(a, b) {
  const fields = [
    ['name', 'Наименование'],
    ['type', 'Тип'],
    ['serial', 'Заводской номер'],
    ['year', 'Год'],
    ['range', 'Диапазон'],
    ['accuracyClass', 'Класс'],
    ['location', 'Место'],
    ['object', 'Объект'],
    ['shop', 'Цех'],
    ['unit', 'Установка'],
    ['intervalMonths', 'Интервал'],
    ['lastCheck', 'Дата поверки'],
    ['checkKind', 'П/К'],
    ['note', 'Примечание'],
    ['sheet', 'Лист'],
  ]
  const out = []
  for (const [k, label] of fields) {
    const o = String(a[k] ?? '')
    const n = String(b[k] ?? '')
    if (o !== n) out.push({ field: label, oldValue: o, newValue: n })
  }
  return out
}

async function syncPull() {
  const cfg = loadCfg()
  const remote = await pullJournal(cfg)
  if (!remote) return { journal: null, msg: 'На сайте ещё нет si-journal.json' }
  const local = loadLocal()
  // prefer newer by updatedAt
  if (!local.updatedAt || (remote.updatedAt && remote.updatedAt >= local.updatedAt)) {
    const j = {
      version: 2,
      updatedAt: remote.updatedAt,
      users: Array.isArray(remote.users) ? remote.users : local.users,
      instruments: remote.instruments || [],
      auditLog: Array.isArray(remote.auditLog) ? remote.auditLog : [],
    }
    // never lose local users if remote has none
    if (!j.users.length && local.users.length) j.users = local.users
    saveLocal(j)
    return { journal: j, msg: `Загружено ${j.instruments.length} СИ` }
  }
  return { journal: local, msg: 'Локальная версия новее, оставлена как есть' }
}

async function syncPush(journal) {
  const cfg = loadCfg()
  if (!canWrite(cfg)) throw new Error('Вставьте токен бригады в «Общая база»')
  saveLocal(journal)
  await pushJournal(cfg, journal)
}

function scheduleAutoPull(onUpdate) {
  const tick = async () => {
    try {
      const cfg = loadCfg()
      const remote = await pullJournal(cfg)
      if (!remote) return
      const local = loadLocal()
      if (remote.updatedAt && remote.updatedAt > (local.updatedAt || '')) {
        const j = {
          version: 2,
          updatedAt: remote.updatedAt,
          users: Array.isArray(remote.users) && remote.users.length ? remote.users : local.users,
          instruments: remote.instruments || [],
          auditLog: Array.isArray(remote.auditLog) ? remote.auditLog : local.auditLog,
        }
        saveLocal(j)
        onUpdate?.(j, true)
      }
    } catch { /* ignore */ }
  }
  const id = setInterval(tick, 25000)
  return () => clearInterval(id)
}

const $ = (s, r = document) => r.querySelector(s)
const app = $('#app')

let journal = loadLocal()
let session = getSession()
let tab = 'journal'
let query = ''
let sheetFilter = ''

let toastTimer = null

function toast(msg) {
  let el = $('.toast')
  if (!el) {
    el = document.createElement('div')
    el.className = 'toast'
    document.body.appendChild(el)
  }
  el.textContent = msg
  el.hidden = false
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { el.hidden = true }, 2800)
}

function sheets() {
  return [...new Set(journal.instruments.map((i) => i.sheet).filter(Boolean))]
}

function filteredList() {
  let list = journal.instruments
  if (sheetFilter) list = list.filter((i) => i.sheet === sheetFilter)
  const q = query.trim().toLowerCase()
  if (q) {
    list = list.filter(
      (i) =>
        i.name.toLowerCase().includes(q) ||
        i.serial.toLowerCase().includes(q) ||
        (i.location || '').toLowerCase().includes(q) ||
        (i.type || '').toLowerCase().includes(q),
    )
  }
  if (statusFilter !== 'all') {
    list = list.filter((i) => getStatus(i).status === statusFilter)
  }
  return [...list].sort((a, b) => {
    const ao = getStatus(a).status === 'overdue' ? 1 : 0
    const bo = getStatus(b).status === 'overdue' ? 1 : 0
    return bo - ao
  })
}

function overdueStats(list) {
  const overdue = list.filter((i) => getStatus(i).status === 'overdue')
  return {
    total: overdue.length,
    man: overdue.filter((i) => isManometer(i.name)).length,
    bim: overdue.filter((i) => isBimetal(i.name)).length,
  }
}

function render() {
  if (!session) {

function drawQr(canvas, text) {
  if (window.QRCode) {
    // qrcode lib style
    try {
      window.QRCode.toCanvas(canvas, text || 'SI', { width: 180, margin: 1 })
      return
    } catch { /* fallthrough */ }
  }
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = '#fff'
  ctx.fillRect(0, 0, 180, 180)
  ctx.fillStyle = '#1b2430'
  ctx.font = '11px sans-serif'
  ctx.fillText('QR: установите библиотеку', 10, 90)
}

function openScanner() {
  const bg = document.createElement('div')
  bg.className = 'modal-bg'
  bg.style.alignItems = 'stretch'
  bg.innerHTML = `
    <div style="background:#0f172a;color:#fff;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;min-height:70vh;border-radius:18px 18px 0 0;padding:12px">

        <strong>Сканер QR</strong>

  document.body.appendChild(bg)

    ).catch(() => toast('Камера недоступна'))

  $('#sc-go', bg).onclick = () => {
    const v = $('#sc-manual', bg).value.trim()
    if (v) { close(); handleQr(v) }

function handleQr(text) {
  const parsed = parseQrPayload(text)
  const serial = (parsed.serial || text).trim()
  const found = journal.instruments.find(
    (i) => i.serial && i.serial.toLowerCase() === serial.toLowerCase(),
  )
  if (found) {
    openDetail(found)
    return
  }
  if (confirm(`СИ «${serial}» не найдено. Добавить?`)) {
    const loc = parsed.location || ''
    // place near same location
    const peers = journal.instruments.filter(
      (i) => loc && i.location && i.location.toLowerCase() === loc.toLowerCase(),
    )
    const sheet = peers[0]?.sheet || sheets()[0] || 'Лист1'
    const inst = {
      id: crypto.randomUUID(),
      name: parsed.name || '',
      type: parsed.type || '',
      serial,
      year: parsed.year || '',
      range: parsed.range || '',
      accuracyClass: parsed.accuracyClass || '',
      location: loc,
      object: parsed.object || '',
      shop: parsed.shop || '',
      unit: parsed.unit || '',
      intervalMonths: parsed.intervalMonths ?? defaultIntervalMonths(parsed.name || ''),
      lastCheck: parsed.lastCheck || '',
      checkKind: parsed.checkKind || '',
      note: '',
      sheet,
    }
    journal.instruments.push(inst)
    addAudit(journal, session, { action: 'add', serial, newValue: inst.name })
    saveLocal(journal)
    tryPush().then(() => {
      toast('Добавлено')
      openDetail(inst)
      render()
    })
  } else {
    query = serial
    render()
  }
}

function renderHistory() {
  const items = journal.auditLog || []
  app.innerHTML = `
    <div class="shell">
      ${header('История')}
      <div class="stack">
        ${items.length === 0 ? '<div class="empty">Пока нет записей</div>' : items.slice(0, 300).map((e) => `
          <div class="card" style="padding:12px">
            <div class="row" style="justify-content:space-between">
              <strong style="font-size:14px">${esc(e.name || e.login)}</strong>
              <span class="subtle" style="font-size:12px">${fmtDate(e.at)}</span>
            </div>
            <div style="font-size:13px;margin-top:6px">${fmtAudit(e)}</div>
          </div>`).join('')}
      </div>
    </div>`
  bindHeader()
}

function fmtAudit(e) {
  if (e.action === 'import') return esc(e.newValue || 'Импорт')
  if (e.action === 'delete') return `Удалил СИ <strong>${esc(e.serial || e.oldValue)}</strong>`
  if (e.action === 'add') return `Добавил СИ <strong>${esc(e.serial)}</strong>`
  if (e.action === 'user_create') return `Создал пользователя <strong>${esc(e.newValue)}</strong>`
  if (e.action === 'update') {
    return `${e.serial ? `СИ <strong>${esc(e.serial)}</strong> · ` : ''}${esc(e.field)}: <span class="subtle">${esc(e.oldValue || '—')}</span> → <strong>${esc(e.newValue || '—')}</strong>`
  }
  return esc(e.action)
}

function renderCloud() {
  const cfg = loadCfg()
  app.innerHTML = `
    <div class="shell">
      ${header('Общая база')}
      <div class="card stack">
        <p class="muted" style="margin:0;font-size:14px">

        </p>
        <div><label class="label">Владелец</label><input class="input" id="c-owner" value="${esc(cfg.owner)}" /></div>
        <div><label class="label">Репозиторий</label><input class="input" id="c-repo" value="${esc(cfg.repo)}" /></div>
        <div><label class="label">Ветка</label><input class="input" id="c-branch" value="${esc(cfg.branch)}" /></div>
        <div><label class="label">Файл</label><input class="input" id="c-path" value="${esc(cfg.path)}" /></div>
        <div><label class="label">Токен бригады (Fine-grained, Contents: Read and write)</label>
          <input class="input" id="c-token" type="password" value="${esc(cfg.token)}" placeholder="github_pat_…" autocomplete="off" /></div>
        <button type="button" class="btn btn-sec btn-block" id="c-save">Сохранить настройки</button>
        <button type="button" class="btn btn-primary btn-block" id="c-push">Опубликовать на сайт</button>
        <button type="button" class="btn btn-sec btn-block" id="c-pull">Загрузить с сайта</button>
        <p class="subtle" style="font-size:12px;margin:0">
          ${canWrite(cfg) ? 'Правки с этого телефона уходят в общую базу.' : 'Без токена правки остаются только на этом телефоне.'}
br>
          Не храните токен в файлах репозитория.
        </p>
      </div>
    </div>`
  bindHeader()
  $('#c-save').onclick = () => {
    saveCfg({
      owner: $('#c-owner').value.trim(),
      repo: $('#c-repo').value.trim(),
      branch: $('#c-branch').value.trim() || 'main',
      path: $('#c-path').value.trim() || 'si-journal.json',
      token: $('#c-token').value.trim(),
    })
    toast('Настройки сохранены')
    render()
  }
  $('#c-push').onclick = async () => {
    try {
      // save cfg from fields first
      saveCfg({
        owner: $('#c-owner').value.trim(),
        repo: $('#c-repo').value.trim(),
        branch: $('#c-branch').value.trim() || 'main',
        path: $('#c-path').value.trim() || 'si-journal.json',
        token: $('#c-token').value.trim(),
      })
      await syncPush(journal)
      toast('Опубликовано')
      render()
    } catch (e) {
      toast(e.message || String(e))
    }
  }
  $('#c-pull').onclick = async () => {
    try {
      saveCfg({
        owner: $('#c-owner').value.trim(),
        repo: $('#c-repo').value.trim(),
        branch: $('#c-branch').value.trim() || 'main',
        path: $('#c-path').value.trim() || 'si-journal.json',
        token: $('#c-token').value.trim(),
      })
      const { journal: j, msg } = await syncPull()
      if (j) journal = j
      toast(msg)
      render()
    } catch (e) {
      toast(e.message || String(e))
    }
  }
}

        },

async function tryPush() {
  const cfg = loadCfg()
  if (!canWrite(cfg)) return
  try {
    await syncPush(journal)
  } catch (e) {
    toast('Локально сохранено. Публикация: ' + (e.message || e))
  }
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
}

function fmtDate(iso) {
  try {
    const d = new Date(iso)
    return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`
  } catch {
    return iso || ''
  }
}

// boot
scheduleAutoPull((j) => {
  journal = j
  if (session) render()
})
render()
